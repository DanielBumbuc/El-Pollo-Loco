<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>El Pollo Loco</title>
    <link rel="stylesheet" href="./style.css">
    <script src="./models/world.class.js"></script>
    <script src="./models/drawable-object.class.js"></script>
    <script src="./models/sound-manager.class.js"></script>
    <script src="./models/start-game.class.js"></script>
    <script src="./models/moveable-object.class.js"></script>
    <script src="./models/background.class.js"></script>
    <script src="./models/statusbar.class.js.js"></script>
    <script src="./models/cloud.class.js"></script>
    <script src="./models/character.class.js"></script>
    <script src="./models/chicken-small.class.js"></script>
    <script src="./models/chicken.class.js"></script>
    <script src="./models/endboss.class.js"></script>
    <script src="./models/bottle.class.js"></script>
    <script src="./models/coin.class.js"></script>
    <script src="./models/keyboard.class.js"></script>
    <script src="./models/level.class.js"></script>
    <script src="./levels/level1.js"></script>
    <script src="./models/throwable-object.class.js"></script>
    <script src="./models/game-over.class.js"></script>
    <script src="./models/you-won.class.js"></script>
    <script src="./js/game.js"></script>
</head>

<body onload="init()">

    <h1 class="game-title">El Pollo Loco</h1>
    
    <nav class="western-navbar">
        <!-- Links: Steuerungslegende -->
        <div class="controls-legend">
            <h3 class="legend-title">Controls</h3>
            <div class="legend-items">
                <div class="legend-item">
                    <span class="key-icon">←→</span>
                    <span class="action">Move</span>
                </div>
                <div class="legend-item">
                    <span class="key-icon">↑</span>
                    <span class="action">Jump</span>
                </div>
                <div class="legend-item">
                    <span class="key-icon">D</span>
                    <span class="action">Throw</span>
                </div>
                <div class="legend-item">
                    <span class="key-icon">Enter</span>
                    <span class="action">Start</span>
                </div>
            </div>
        </div>
        <div class="western-controls">
            <div class="western-button restart-btn" onclick="resetGame()" title="Restart Game">
                <svg width="24" height="24" viewBox="0 0 24 24" fill="currentColor">
                    <!-- Restart/Refresh Icon -->
                    <path d="M17.65,6.35C16.2,4.9 14.21,4 12,4A8,8 0 0,0 4,12A8,8 0 0,0 12,20C15.73,20 18.84,17.45 19.73,14H17.65C16.83,16.33 14.61,18 12,18A6,6 0 0,1 6,12A6,6 0 0,1 12,6C13.66,6 15.14,6.69 16.22,7.78L13,11H20V4L17.65,6.35Z"/>
                </svg>
                <span class="western-star">✦</span>
            </div>
            
            <div class="western-button volume-btn" id="volumeButton" onclick="activeControlButton(this)" title="Volume">
                <!-- Volume On SVG (Standard sichtbar) -->
                <svg id="volumeOnIcon" width="24" height="24" viewBox="0 0 24 24" fill="currentColor">
                    <path d="M14,3.23V5.29C16.89,6.15 19,8.83 19,12C19,15.17 16.89,17.84 14,18.7V20.77C18,19.86 21,16.28 21,12C21,7.72 18,4.14 14,3.23M16.5,12C16.5,10.23 15.5,8.71 14,7.97V16C15.5,15.29 16.5,13.76 16.5,12M3,9V15H7L12,20V4L7,9H3Z"/>
                </svg>
                
                <!-- Volume Off SVG (versteckt) -->
                <svg id="volumeOffIcon" class="d-none" width="24" height="24" viewBox="0 0 24 24" fill="currentColor">
                    <path d="M12,4L9.91,6.09L12,8.18M4.27,3L3,4.27L7.73,9H3V15H7L12,20V13.27L16.25,17.53C15.58,18.04 14.83,18.46 14,18.7V20.77C15.38,20.45 16.63,19.82 17.68,18.96L19.73,21L21,19.73L12,10.73M19,12C19,12.94 18.8,13.82 18.46,14.64L19.97,16.15C20.62,14.91 21,13.5 21,12C21,7.72 18,4.14 14,3.23V5.29C16.89,6.15 19,8.83 19,12M16.5,12C16.5,10.23 15.5,8.71 14,7.97V10.18L16.45,12.63C16.5,12.43 16.5,12.21 16.5,12Z"/>
                </svg>
                
                <span class="western-star">✦</span>
            </div>
        </div>
    </nav>
    
    <!-- Game Canvas Container -->
    <div class="game-container">
        <canvas id="canvas" width="720" height="480"></canvas>
        
        <!-- Simple Play Button -->
        <button class="simple-play-button" id="playButton" onclick="startGame()">
            <svg width="60" height="60" viewBox="0 0 60 60" fill="none">
                <!-- Simple Circle Background -->
                <circle cx="30" cy="30" r="28" fill="#8B4513" stroke="#654321" stroke-width="4"/>
                
                <!-- Play Triangle -->
                <path d="M23 18L23 42L43 30Z" fill="#FFDC00"/>
            </svg>
        </button>

        <button class="simple-restart-button d-none" id="restartButton" onclick="resetGame()">
            <svg width="60" height="60" viewBox="0 0 24 24" fill="none">
                <!-- Circle Background -->
                <circle cx="12" cy="12" r="11" fill="#8B4513" stroke="#654321" stroke-width="1"/>
                
                <!-- Restart Icon from Control Center (yellow like play button, 10% smaller) -->
                <path d="M17.65,6.35C16.2,4.9 14.21,4 12,4A8,8 0 0,0 4,12A8,8 0 0,0 12,20C15.73,20 18.84,17.45 19.73,14H17.65C16.83,16.33 14.61,18 12,18A6,6 0 0,1 6,12A6,6 0 0,1 12,6C13.66,6 15.14,6.69 16.22,7.78L13,11H20V4L17.65,6.35Z" fill="#FFDC00" transform="scale(0.8)" transform-origin="12 12"/>
            </svg>
        </button>
    </div>
    
</body>

</html>
